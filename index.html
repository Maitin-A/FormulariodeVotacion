<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Votación - Ven 9-1-1</title>
  </head>
  <link rel="stylesheet" href="./index.css">
  <body>
    <h1>Votación de Cuadros para el 13vo Aniversario del Ven 9-1-1</h1>
    <p class="subtitulo">Solo puedes votar por un solo cuadro</p>

    <!-- Paso 1: Identificación -->
    <div class="panel-votante">
      <label for="select-votante">Indica la sede:</label>
      <select id="select-votante">
        <option value="">--Selecciona una de las opciones--</option>
      </select>
      <span id="badge-estado" class="badge-fijado"></span>
    </div>

    <!-- Paso 2: Obras disponibles para votar -->
    <div id="grid-obras" class="grid-obras"></div>

    <!-- Paso 3: Confirmación y Envío -->
    <div
      id="panel-confirmacion"
      class="panel-confirmacion"
      style="display: none"
    >
      <p id="resumen-seleccion" style="margin-top: 0; font-size: 1.05rem"></p>
      <button id="btn-enviar" class="btn-submit" disabled>
        Confirmar mi voto
      </button>
      <div id="mensaje-estado"></div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
