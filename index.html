<!doctype html>
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Votación de Obras</title>
  </head>
  <link rel="stylesheet" href="./index.css" />
  <body>
    <h1>Votación de Obras</h1>
    <p class="subtitulo">
      Haz clic en una imagen para ampliarla o en el botón para seleccionarla.
    </p>

    <!-- Panel Votante -->
    <div class="panel">
      <label for="select-votante">Indica tu entidad / equipo:</label>
      <select id="select-votante">
        <option value="">-- Selecciona quién eres --</option>
      </select>
      <span id="badge-estado" class="badge-fijado"></span>
    </div>

    <!-- Catálogo de obras -->
    <div id="grid-obras" class="grid-obras"></div>

    <!-- Confirmación de voto -->
    <div
      id="panel-confirmacion"
      class="panel"
      style="display: none; text-align: center"
    >
      <p id="resumen-seleccion" style="margin-top: 0"></p>
      <button id="btn-enviar" class="btn-submit" disabled>
        Confirmar mi voto
      </button>
      <div
        id="mensaje-estado"
        style="margin-top: 12px; font-weight: bold"
      ></div>
    </div>

    <!-- Visor emergente (Lightbox) -->
    <div id="lightbox-modal" class="lightbox-modal">
      <button class="lightbox-close" id="lightbox-close">&times;</button>
      <img id="lightbox-img" class="lightbox-img" src="" alt="Ampliación" />
      <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
